name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(macos/tests/*-test.swift)
          [ ${#tests[@]} -gt 0 ] || { echo "no tests found"; exit 1; }
          for t in "${tests[@]}"; do
            echo "==> $t"
            swiftc -parse-as-library macos/Updater.swift macos/ServerURL.swift "$t" -o "$RUNNER_TEMP/test-bin"
            "$RUNNER_TEMP/test-bin"
          done

      - name: Build
        run: zsh macos/build.sh
