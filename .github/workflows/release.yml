# Builds Nexview for Mac on an Apple Silicon runner and publishes a GitHub release
# whenever macos/VERSION on main holds a version that has not been released yet.
name: Release

on:
  push:
    branches: [main]
    paths: ["macos/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          v=$(tr -d '[:space:]' < macos/VERSION)
          [[ "$v" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "invalid version: $v"; exit 1; }
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(macos/tests/*-test.swift)
          [ ${#tests[@]} -gt 0 ] || { echo "no tests found"; exit 1; }
          for t in "${tests[@]}"; do
            echo "==> $t"
            swiftc -parse-as-library macos/Updater.swift macos/ServerURL.swift macos/Backoff.swift "$t" -o "$RUNNER_TEMP/test-bin"
            "$RUNNER_TEMP/test-bin"
          done

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: zsh macos/build.sh

      - name: Package
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ditto -c -k --keepParent build/Nexview.app "Nexview-$VERSION.zip"

      - name: Sign update (Ed25519)
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SIGNING_KEY: ${{ secrets.NEXVIEW_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "${SIGNING_KEY:-}" ] || { echo "::error::secret NEXVIEW_UPDATE_SIGNING_KEY is not set"; exit 1; }
          OPENSSL=/opt/homebrew/opt/openssl@3/bin/openssl
          [ -x "$OPENSSL" ] || { brew install openssl@3 >/dev/null; OPENSSL="$(brew --prefix openssl@3)/bin/openssl"; }
          "$OPENSSL" version
          KEYDIR=$(umask 077 && mktemp -d)
          trap 'rm -rf "$KEYDIR"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$KEYDIR/key.pem")
          "$OPENSSL" pkeyutl -sign -rawin -inkey "$KEYDIR/key.pem" -in "Nexview-$VERSION.zip" -out "$KEYDIR/sig.bin"
          [ "$(wc -c < "$KEYDIR/sig.bin" | tr -d ' ')" = 64 ] || { echo "::error::unexpected signature length"; exit 1; }
          # Self-check against the public key derived from the private key.
          "$OPENSSL" pkey -in "$KEYDIR/key.pem" -pubout -out "$KEYDIR/pub.pem"
          "$OPENSSL" pkeyutl -verify -rawin -pubin -inkey "$KEYDIR/pub.pem" -in "Nexview-$VERSION.zip" -sigfile "$KEYDIR/sig.bin"
          base64 < "$KEYDIR/sig.bin" | tr -d '\n' > "Nexview-$VERSION.zip.sig"

      - name: Upload artifact
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            Nexview-${{ steps.version.outputs.value }}.zip
            Nexview-${{ steps.version.outputs.value }}.zip.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # What changed: the "## $VERSION" section of macos/CHANGELOG.md.
          awk -v v="## $VERSION" '$0 == v {on=1; next} on && /^## / {exit} on' macos/CHANGELOG.md > changes.md
          cat changes.md > notes.md
          [[ -s changes.md ]] && echo >> notes.md
          cat >> notes.md <<NOTES
          Nexview for Mac $VERSION for Apple Silicon Macs (macOS 14 Sonoma or newer).

          **Install:** download \`Nexview-$VERSION.zip\`, unzip it and move **Nexview** to Applications.
          The app is signed ad hoc, so the first time you open it, right-click it and choose **Open**.

          Then enter the address of your Nexview server and sign in with your Nexview account.
          NOTES
          gh release create "v$VERSION" "Nexview-$VERSION.zip" "Nexview-$VERSION.zip.sig" \
            --title "Nexview for Mac $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
